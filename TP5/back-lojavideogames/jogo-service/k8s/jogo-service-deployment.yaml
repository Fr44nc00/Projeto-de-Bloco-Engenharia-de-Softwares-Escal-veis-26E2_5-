apiVersion: apps/v1
kind: Deployment
metadata:
  name: jogo-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jogo-service
  template:
    metadata:
      labels:
        app: jogo-service
    spec:
      containers:
        - name: jogo-service
          image: fr44nc00/jogo-service:latest
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: jogo-service-service
spec:
  selector:
    app: jogo-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: LoadBalancer
