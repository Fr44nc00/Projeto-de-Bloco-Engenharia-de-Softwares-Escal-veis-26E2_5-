name: CI/CD Pipeline - Backend Services

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-eureka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test
        working-directory: TP5/back-lojavideogames/eureka-server

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Eureka Server Tests
          path: TP5/back-lojavideogames/eureka-server/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build Eureka Server
        run: mvn clean package
        working-directory: TP5/back-lojavideogames/eureka-server

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest TP5/back-lojavideogames/eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest

  build-and-push-jogo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test
        working-directory: TP5/back-lojavideogames/jogo-service

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Jogo Service Tests
          path: TP5/back-lojavideogames/jogo-service/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build Jogo Service
        run: mvn clean package
        working-directory: TP5/back-lojavideogames/jogo-service

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jogo-service:latest TP5/back-lojavideogames/jogo-service
          docker push ${{ secrets.DOCKER_USERNAME }}/jogo-service:latest

  build-and-push-usuario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test
        working-directory: TP5/back-lojavideogames/usuario-service

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Usuario Service Tests
          path: TP5/back-lojavideogames/usuario-service/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build Usuario Service
        run: mvn clean package
        working-directory: TP5/back-lojavideogames/usuario-service

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/usuario-service:latest TP5/back-lojavideogames/usuario-service
          docker push ${{ secrets.DOCKER_USERNAME }}/usuario-service:latest

  build-and-push-lojavideogames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test
        working-directory: TP5/back-lojavideogames/lojavideogames

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Loja Videogames Tests
          path: TP5/back-lojavideogames/lojavideogames/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build Loja Videogames Service
        run: mvn clean package
        working-directory: TP5/back-lojavideogames/lojavideogames

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lojavideogames:latest TP5/back-lojavideogames/lojavideogames
          docker push ${{ secrets.DOCKER_USERNAME }}/lojavideogames:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push-eureka, build-and-push-jogo, build-and-push-usuario, build-and-push-lojavideogames]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f TP5/back-lojavideogames/k8s/eureka-server-deployment.yaml
          kubectl apply -f TP5/back-lojavideogames/k8s/jogo-service-deployment.yaml
          kubectl apply -f TP5/back-lojavideogames/k8s/usuario-service-deployment.yaml
          kubectl apply -f TP5/back-lojavideogames/k8s/lojavideogames-deployment.yaml
