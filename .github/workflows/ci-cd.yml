name: CI/CD Pipeline - Backend Services

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-eureka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Eureka Server
        run: mvn clean package -DskipTests
        working-directory: TP5/back-lojavideogames/eureka-server

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest TP5/back-lojavideogames/eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest

